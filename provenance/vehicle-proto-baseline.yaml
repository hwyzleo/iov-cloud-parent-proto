      envelope_keyprov_cr008_ack.bin:          { sha256: c2463ffbf5ecf94466d302bea9ca6b6d6b7a6b0c893364675aca97ca3a2337a6, bytes: 539 }

# ---- Release manifest (PAR-PROTO-DSN-CR-005 §9) ----------------------------
release_manifest:
  inventory_canonicalization_versions: [1, 2]
  ecu_software_models: [SINGLE_IMAGE, MULTI_TARGET]
  deprecated_contracts:
    - iov.vmd.swinv.v1.SoftwareInventoryReport
  test_vector_bundle_sha256: 897a8abb811441a944c9eea2a2c61ccee4f2fec88c0d7ab00206cd0ea055b89b
  # PAR-PROTO-DSN-CR-006 §6 / CR-007: independent security artifact for keyprov.
  modules: [proto-vmd, proto-vehicle-common, proto-fota, proto-vagw, proto-keyprov]
  security_artifact:
    coordinate: net.hwyz.iov.cloud.proto:proto-keyprov:0.0.1-SNAPSHOT
    packages: [security.keyprov.v1]
    depends_on: [proto-vehicle-common]
    descriptor: descriptors/security-keyprov-v1.pb
    source_bundle: security-keyprov-v1-sources.tar.gz
    sha256: cd610406aad05d5215a953c140a28b547fa3b2eb537ac7b27023e2911c3f5230
    # CR-007: envelope v1 capability requires supported_envelope_formats +
    # DescriptorSet hash + PAR-PROTO release + FW-SEC Provider readiness.
    envelope_formats: [KEY_ENVELOPE_FORMAT_ECDH_ES_P256_V1]
    # CR-008: per-purpose import attestation capability is a conjunction; the
    # only governed algorithm is ECDSA P-256/SHA-256/P1363 low-S.
    import_proof_algorithms: [IMPORT_PROOF_ALGORITHM_ECDSA_P256_SHA256_P1363]
    canonical_reference_impl: verify/KeyprovCanonicalV1.java
  # NOTE: no cloud_events and no proto-ota artifact. The OTA->VMD observed event
  # is NOT Proto and NOT part of PAR-PROTO (design §7 / RD-005-8).

# ---- PayloadType registry (payload_type = vehicle.fota.v1.<MessageName>) ---
# Class full-name in generated Java = payload_type string (acceptance §8).
payload_type_registry:
  fota:
    - vehicle.fota.v1.TaskCheckRequest
    - vehicle.fota.v1.TaskCheckResponse
    - vehicle.fota.v1.ConsentReport
    - vehicle.fota.v1.ConsentResponse
    - vehicle.fota.v1.DownloadGrantRequest
    - vehicle.fota.v1.DownloadGrantResponse
    - vehicle.fota.v1.StageResultReport
    - vehicle.fota.v1.StageResultResponse
    - vehicle.fota.v1.InstallPermitRequest
    - vehicle.fota.v1.InstallPermitResponse
    - vehicle.fota.v1.ExecutionEvent
    - vehicle.fota.v1.EventResponse
    - vehicle.fota.v1.ControlAckReport
    - vehicle.fota.v1.ControlAckResponse
    - vehicle.fota.v1.FinalResultReport
    - vehicle.fota.v1.FinalResultResponse
    - vehicle.fota.v1.LogGrantRequest
    - vehicle.fota.v1.LogGrantResponse
    - vehicle.fota.v1.LogUploadResult
    - vehicle.fota.v1.LogResultResponse
    - vehicle.fota.v1.ReconcileRequest
    - vehicle.fota.v1.ReconcileResponse
    - vehicle.fota.v1.PolicyRequest
    - vehicle.fota.v1.PolicyResponse
  common:
    - vehicle.common.v1.VehicleMessageEnvelope
  # PAR-PROTO-DSN-CR-006: keyprov payload_type = exact security.keyprov.v1.<MessageName>.
  # No wildcard / short-name / reflective fallback resolution is permitted.
  keyprov:
    - security.keyprov.v1.KeyProvisioningRequest
    - security.keyprov.v1.KeyProvisioningResponse
