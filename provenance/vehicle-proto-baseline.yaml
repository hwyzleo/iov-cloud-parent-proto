# ---- PAR-PROTO-DSN-CR-008 additive extension (per-purpose import attestation) -
# CR-008 appends to security.keyprov.v1 by FIELD/ENUM ADD ONLY:
#   + enum ImportProofAlgorithm
#   + KeyImportItemResult.import_proof_algorithm = 10
#   + KeyImportItemResult.recipient_certificate_digest = 11
#   + KeyImportItemResult.proof_algorithm = 6 deprecated (string wire type kept)
# Field numbers 1..9, message names, package and protocol_version=keyprov-v1 are
# UNCHANGED. The CR-006/CR-007 golden hashes above stay authoritative: the old
# payload bytes are byte-identical (additive wire compatibility, verified by
# verify/KeyprovCr008IntegrationCheck.java).
#
# Scope boundary: PAR-PROTO owns the IDL, the proofInputV1 canonical bytes, field
# binding and the P1363 length / r,s-range / low-S contract. Device signing is
# owned by TBOX-SEC and the real ECDSA P-256/SHA-256 verification by FW-SEC;
# PAR-PROTO neither signs nor verifies and ships no cryptographic reference
# implementation. The import_proof bytes in the golden files are a deterministic
# P1363 low-S *placeholder* (r=1, s=1) pinning the wire/canonical contract only.
cr008_extension:
  protocol_version: keyprov-v1
  additive_wire_compatible: true
  breaking_baseline: previous-release-empty  # buf breaking runs in CI vs prior release tag
  business_domain: V2C_COMM                   # case-sensitive strict; legacy v2c_comm is regression-only
  import_proof_algorithms: [IMPORT_PROOF_ALGORITHM_ECDSA_P256_SHA256_P1363]
  proof_signature: ECDSA_P256_SHA256_P1363_LOW_S
  proof_input: proofInputV1                   # eight flat uint32be-length-prefixed segments
  keyprov_descriptor_sha256: cd610406aad05d5215a953c140a28b547fa3b2eb537ac7b27023e2911c3f5230
  canonical_reference_impl: verify/KeyprovCanonicalV1.java
  contract_check: verify/KeyprovContractCheck.java
  integration_check: verify/KeyprovCr008IntegrationCheck.java
  capability_conditions:
    par_proto_cr008_release: true
    tbox_sec_sign: TBOX-SEC-CR-020
    fw_sec_verify: FW-SEC-CR-016-IMPORT_PROOF_VERIFY_ECDSA_P256_V1
    vmd_atomic_activation: VMD-CR-062
    java_cpp_golden_negative_vectors: true
  golden_reference:
    producer: java (protoc 3.25.5 / protobuf-java 3.25.5)
    location: verify/golden/expected/
    files:
