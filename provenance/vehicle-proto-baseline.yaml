# =============================================================================
# vehicle-proto-baseline.yaml
# PAR-PROTO-DSN-CR-002 — Common/FOTA bootstrap donor freeze + authority cutover
# =============================================================================
# This manifest records the one-time bootstrap of vehicle.common.v1 and
# vehicle.fota.v1 from the frozen VEH-PROTO snapshot, and the authority cutover
# to PAR-PROTO. VEH-PROTO is the vehicle-side protocol DOCUMENTATION SSOT (no
# independent proto repo is produced); the physical donor source lives in the
# vehicle-side repos (iov-vehicle-cgw-fota proto/) which declare byte-level
# consistency with VEH-PROTO.
# After cutover: canonical PRs originate ONLY in PAR-PROTO and VEH-PROTO pins
# released versions (one-way: par-proto -> veh-proto).
# =============================================================================

contract_authority: par-proto

bootstrap_source:
  # VEH-PROTO is the vehicle protocol documentation SSOT; it does not emit a repo.
  repository: VEH-PROTO (documentation SSOT; donor physical source: iov-vehicle-cgw-fota proto/)
  revision: frozen-snapshot-2026-08-14
  # authority identity is the file SHA-256 set below (descriptor + per-file).
  common_descriptor_sha256: 4ba4c1470270b16a44f30ce3bfff2062a703c0c88ac56bf89925a810651bc200
  fota_descriptor_sha256: 56924c848d767e5e2c0cde20a1831208ab5d416035dd83ccd8354d6742a9008e

# Release from which PAR-PROTO becomes the canonical IDL authority.
# PENDING: set to the actual bootstrap release tag once it passes Java/C++
# generation and cross-language golden gates (acceptance criteria §11).
authority_effective_from: PENDING-bootstrap-release

sync_direction: par-proto-to-veh-proto

# ---- Donor freeze (PAR-PROTO-DSN-CR-002 §3.1) -----------------------------
