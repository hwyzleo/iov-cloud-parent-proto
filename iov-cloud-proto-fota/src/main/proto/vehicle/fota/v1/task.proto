syntax = "proto3";

package vehicle.fota.v1;

import "vehicle/fota/v1/types.proto";

option cc_enable_arenas = true;

// =============================================================================
// vehicle.fota.v1 task - 升级任务检测 (VEH-PROTO §6.3 + PAR-PROTO-DSN-CR-005)
// =============================================================================
// SSOT：本文件由 VEH-PROTO 冻结快照 bootstrap；PAR-PROTO-DSN-CR-005 以字段
// 追加方式扩展 TaskCheckRequest/Response（canonicalization 版本协商），本仓为
// canonical 权威，VEH-PROTO 按 release 单向同步。既有字段号 1~20 永不改号。
// inventory_mode=FULL 时 ecu_list 必须非空；DIGEST 只有云端已有同 VIN、
// revision、算法和摘要匹配的完整清单时才能 ACCEPTED。
// inventory_disposition!=ACCEPTED 时不得消费任务；有任务时 task、
// availability_status 和 vehicle_task_status 条件必填。
// strategy 在 v1 暂以版本化 Protobuf bytes 承载，不得使用 JSON。
// =============================================================================

// 任务检测请求。
message TaskCheckRequest {
  string baseline_code = 1;
  string fota_master_version = 2;            // FOTA Master 版本（替代旧契约的 master 版本字段）
  optional string local_vehicle_task_id = 3;
  optional uint64 local_task_revision = 4;
  optional VehicleTaskStatus local_vehicle_task_status = 5;
  optional DispositionResult last_disposition_result = 6;
  optional CacheActionResult last_cache_action_result = 7;
  InventoryMode inventory_mode = 8;         // FULL 时 ecu_list 必填
  uint64 inventory_revision = 9;
  Digest ecu_list_digest = 10;
  repeated EcuVersion ecu_list = 11;        // FULL 模式

  // PAR-PROTO-DSN-CR-005：清单规范化版本。旧生产者值为 0；当 ecu_list 全部为
  // legacy UNSPECIFIED/SINGLE_IMAGE 且 software_units 为空时按 canonicalization-v1。
  // 任一 ECU 使用 MULTI_TARGET/software_units 时，version 必须为 2。
  // DIGEST 请求缺少版本时只允许匹配历史 v1 FULL。
  // v1 与 v2 摘要空间独立，禁止跨版本比较或以 v2 重算覆盖 v1 存量值。
  uint32 inventory_canonicalization_version = 12;
}

// 冻结/任务快照。
message VehicleTaskSnapshot {
  string activity_id = 1;
  string vehicle_task_id = 2;
  uint64 task_revision = 3;
  string target_baseline_code = 4;
  int64 release_at_ms = 5;
  int64 start_time_ms = 6;
  int64 end_time_ms = 7;
  bool consent_required = 8;
  optional string terms_version = 9;
  bytes strategy = 10;                      // v1 暂以版本化 Protobuf bytes 承载
  repeated PackageSummary package_list = 11;
  string install_plan_version = 12;
}

// 任务检测响应。
message TaskCheckResponse {
  ResponseStatus status = 1;
  InventoryDisposition inventory_disposition = 2;
  optional uint64 accepted_inventory_revision = 3;
  optional InventoryMode required_inventory_mode = 4;
  repeated string supported_inventory_digest_algorithms = 5;
  optional string next_action = 6;
  optional AvailabilityStatus availability_status = 7;
  optional string reason_code = 8;
  optional VehicleTaskStatus vehicle_task_status = 9;
  optional string local_task_disposition = 10;
  optional string superseded_by_vehicle_task_id = 11;
  optional bool snapshot_changed = 12;
  optional string snapshot_change_type = 13;
  optional bool reconsent_required = 14;
  optional string package_cache_action = 15;
  optional bool download_allowed = 16;
  optional string download_deny_reason = 17;
  optional bool install_request_allowed = 18;
  optional string install_request_deny_reason = 19;
  optional VehicleTaskSnapshot task = 20;

  // PAR-PROTO-DSN-CR-005：云端支持的 ECU 软件模型与规范化版本。
  // 客户端不得仅因列表包含 MULTI_TARGET 就启用；还需 release-set/ECU capability
  // 允许。未知模型或规范化版本必须 FULL_REQUIRED/ALGORITHM_UNSUPPORTED 形式
  // fail-closed，不得按 SINGLE_IMAGE 降级。
  repeated EcuSoftwareModel supported_ecu_software_models = 21;
  repeated uint32 supported_inventory_canonicalization_versions = 22;
}
